 const fs=Math.round(w*(h>w*1.5?.062:.056));x.fillStyle="#fff";x.textAlign="center";x.shadowColor="#000a";x.shadowBlur=w*.02;

function buildSl(){$("sl").innerHTML="";SL.forEach(([k,l,a,b])=>{const lb=document.createElement("label"),i=document.createElement("input");lb.textContent=l+": "+cfg[k];i.type="range";i.min=a;i.max=b;i.value=cfg[k];i.oninput=()=>{cfg[k]=+i.value;lb.textContent=l+": "+cfg[k];applyCfg();saveCfg()};$("sl").append(lb,i)})}
function buildTh(){const t=$("th");t.innerHTML="";bgs.forEach((u,k)=>{const d=document.createElement("div"),x=document.createElement("b");d.style.backgroundImage="url("+u+")";x.textContent="×";x.onclick=()=>{bgs.splice(k,1);saveBg();loadImgs();buildTh();show()};d.append(x);t.append(d)});if(!bgs.length)t.textContent="Belum ada foto."}
function saveBg(){try{localStorage.setItem("qbg",JSON.stringify(bgs));return true}catch(e){alert("Penyimpanan penuh. Hapus beberapa foto dulu.");return false}}
$("up").onchange=async e=>{for(const f of e.target.files){if(bgs.length>=12){alert("Maksimal 12 foto.");break}try{const bm=await createImageBitmap(f),k=Math.min(1,1600/Math.max(bm.width,bm.height)),c=document.createElement("canvas");c.width=bm.width*k;c.height=bm.height*k;c.getContext("2d").drawImage(bm,0,0,c.width,c.height);bgs.push(c.toDataURL("image/jpeg",.8));if(!saveBg()){bgs.pop();break}}catch(er){}}e.target.value="";loadImgs();buildTh();show()};
$("mode").onchange=e=>{cfg.mode=e.target.value;saveCfg();show()};
$("ba").onclick=()=>{$("mode").value=cfg.mode;buildSl();buildTh();$("adm").classList.add("on")};
$("ac").onclick=()=>$("adm").classList.remove("on");
$("rs").onclick=()=>{Object.assign(cfg,{cx:50,cy:9,cs:64,dx:50,dy:17,ds:15});saveCfg();applyCfg();buildSl()};
loadImgs();applyCfg();show();tick();refill();
</script></body></html>
